# Apache WebSocket Proxy Yapılandırması
# Socket.IO için WebSocket desteği
# Bu dosyayı /etc/apache2/sites-available/cozum.net.conf dosyanıza ekleyin veya
# VirtualHost yapılandırmanızın içine kopyalayın

# ÖNEMLİ: Önce gerekli modülleri aktif etmeniz gerekiyor:
# sudo a2enmod proxy
# sudo a2enmod proxy_http
# sudo a2enmod proxy_wstunnel
# sudo systemctl restart apache2

<VirtualHost *:80>
    ServerName cozum.net
    ServerAlias www.cozum.net
    
    # SSL yapılandırması (HTTPS için)
    # Let's Encrypt veya başka bir SSL sertifikası kullanıyorsanız:
    # Redirect permanent / https://cozum.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName cozum.net
    ServerAlias www.cozum.net
    
    # SSL sertifika yapılandırması
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/cozum.net/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/cozum.net/privkey.pem
    
    # DocumentRoot (eğer statik dosyalar varsa)
    # DocumentRoot /var/www/yol-asist/public
    
    # Proxy ayarları - Socket.IO için WebSocket desteği
    # Socket.IO path'i için özel proxy yapılandırması
    <LocationMatch "^/socket\.io/">
        # WebSocket upgrade için gerekli header'ları proxy'le
        ProxyPreserveHost On
        ProxyPass http://localhost:3000/socket.io/
        ProxyPassReverse http://localhost:3000/socket.io/
        
        # WebSocket upgrade için gerekli ayarlar
        RewriteEngine on
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]
        
        # WebSocket için gerekli header'lar
        Header set Upgrade "websocket"
        Header set Connection "Upgrade"
    </LocationMatch>
    
    # Alternatif yapılandırma (daha basit, Socket.IO için önerilen)
    # Bu yapılandırma Socket.IO'nun hem HTTP polling hem de WebSocket'i destekler
    ProxyPreserveHost On
    
    # Socket.IO için WebSocket proxy
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket.io/(.*) ws://localhost:3000/socket.io/$1 [P,L]
    
    # Socket.IO için HTTP proxy (polling fallback için)
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /socket.io/(.*) http://localhost:3000/socket.io/$1 [P,L]
    
    # Diğer API istekleri için normal proxy
    ProxyPass /api http://localhost:3000/api
    ProxyPassReverse /api http://localhost:3000/api
    
    # Root path için proxy (isteğe bağlı)
    # ProxyPass / http://localhost:3000/
    # ProxyPassReverse / http://localhost:3000/
    
    # Log dosyaları
    ErrorLog ${APACHE_LOG_DIR}/cozum.net-error.log
    CustomLog ${APACHE_LOG_DIR}/cozum.net-access.log combined
</VirtualHost>

# Eğer sadece HTTP (port 80) kullanıyorsanız, yukarıdaki VirtualHost *:443 yerine
# VirtualHost *:80 kullanın ve SSL yapılandırmalarını kaldırın
