<IfModule mod_ssl.c>
<VirtualHost *:443>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName cozum.net
	ServerAlias www.cozum.net

	ServerAdmin info@cozum.net
	# Frontend için DocumentRoot - PM2 ile serve edilen frontend'e proxy yapıyoruz
	# DocumentRoot artık kullanılmıyor, tüm istekler frontend'e gidiyor
	# DocumentRoot /var/www/html

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Proxy ayarları
	ProxyPreserveHost On
	ProxyRequests Off
	
	# Socket.IO WebSocket Proxy - EN ÖNCE /socket.io/ için yapılandırma
	# Socket.IO hem WebSocket hem de HTTP polling kullanır, bu yüzden her ikisini de desteklemeliyiz
	RewriteEngine On
	
	# Socket.IO için WebSocket proxy (wss://)
	# Upgrade header'ı websocket olduğunda WebSocket bağlantısı kurulur
	RewriteCond %{HTTP:Upgrade} =websocket [NC]
	RewriteRule /socket\.io/(.*) ws://localhost:3000/socket.io/$1 [P,L]
	
	# Socket.IO için HTTP proxy (polling fallback - WebSocket bağlantısı kurulamazsa)
	# Upgrade header'ı websocket değilse normal HTTP proxy kullanılır
	RewriteCond %{HTTP:Upgrade} !=websocket [NC]
	RewriteRule /socket\.io/(.*) http://localhost:3000/socket.io/$1 [P,L]
	
	# Socket.IO path'ini frontend proxy'den exclude et
	ProxyPass /socket.io !
	
	# Yol Asistan API Reverse Proxy - ÖNCE /api'yi backend'e yönlendir
	# /api ve /api/v1 yolundaki tüm istekleri Node.js backend'e (port 3000) yönlendir
	<LocationMatch "^/api(/v1)?">
		ProxyPass http://localhost:3000
		ProxyPassReverse http://localhost:3000
		# CORS ve diğer header'ları koru
	</LocationMatch>
	
	# phpMyAdmin - /phpmyadmin yolunu exclude et (kendi yapılandırması var)
	# phpMyAdmin conf-enabled/phpmyadmin.conf dosyasından yönetiliyor
	ProxyPass /phpmyadmin !
	
	# Frontend Reverse Proxy
	# /api, /socket.io ve /phpmyadmin hariç tüm istekleri frontend'e (port 5173) yönlendir
	# SPA routing için tüm istekler frontend'e gider
	ProxyPass /api !
	ProxyPass /socket.io !
	ProxyPass / http://localhost:5173/
	ProxyPassReverse / http://localhost:5173/

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/cozum.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/cozum.net/privkey.pem
</VirtualHost>
</IfModule>
